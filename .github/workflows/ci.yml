name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
  NEXT_PUBLIC_ALLOW_INDEXING: "false"
  SUPABASE_AUTH_CAPTCHA_SECRET: 1x0000000000000000000000000000000AA
  RESEND_SMTP_PASSWORD: re_ci_placeholder_not_a_real_key
  DISABLE_PAYMENTS: "true"
  DISABLE_DOCUMENT_UPLOADS: "true"
  DISABLE_AI_ASSISTANT: "true"
  DISABLE_COMMUNITY: "true"
  DISABLE_APPOINTMENTS: "true"
  DISABLE_PUBLIC_INTAKE: "true"
  DISABLE_WHATSAPP: "true"
  DISABLE_COURSES: "true"
  DISABLE_PROFESSIONAL_PORTAL: "true"
  DISABLE_PUBLIC_REGISTRATION: "true"

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm integrity:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm check:env
      - run: pnpm check:secrets
      - run: pnpm audit:prod
      - run: pnpm build

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.109.1
      - name: Start local Supabase from migrations
        run: supabase start
      - name: Lint database
        run: supabase db lint --local --level warning
      - name: Test database and RLS
        run: supabase test db
      - name: Verify generated schema drift is empty
        run: |
          supabase --agent no --output-format text db diff --local --schema public > /tmp/schema.diff.sql
          test ! -s /tmp/schema.diff.sql
      - if: always()
        run: supabase stop --no-backup

  e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [app, database]
    env:
      DISABLE_PUBLIC_REGISTRATION: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.109.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: supabase start
      - name: Map local Supabase variables without printing values
        run: |
          supabase status -o env > /tmp/supabase.env
          node scripts/ci-map-supabase-env.mjs /tmp/supabase.env "$GITHUB_ENV"
      - run: pnpm test:e2e
      - if: always()
        run: supabase stop --no-backup
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
