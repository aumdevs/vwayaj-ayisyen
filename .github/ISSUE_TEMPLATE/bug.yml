name: Bug report
description: Report a reproducible product defect without personal data.
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: "Do not include passwords, tokens, documents, emails, phone numbers, case details or other personal data."
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction using synthetic data
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options: [Local, Preview, Production]
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
